<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="エルソードのレアアバター(右)アクセを部位ごとに選び、部位の能力値・セット効果・合計値を確認できるシミュレーター">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>エルソード アクセ組み合わせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Orbitron:wght@600;700&display=swap">
<style>
/* Layout: two equipment columns (game order) around a core panel; set effects + totals beside or below. Light tech look: silver ground, electric-blue lines, chamfered corners. */
:root{
  --bg:#e9edf2; --panel:#f7f9fb; --card:#ffffff; --head:#eef2f6; --line:#d3dbe5; --frame:#9eacbe;
  --ink:#141a22; --ink2:#1f2a38; --muted:#5f6a7a; --title:#0b2a55; --accent:#1a73ff; --accent-d:#1859c9;
  --chip:#e6ecf3; --iconbg:#eef2f7; --icon-on:#0f2747; --icon-off:#a7b2c1; --off:#8c97a6;
  --on-bg:#e2f0ff; --on-bd:#5d9cf2; --d:#e0336e;
  --up-bg:#e3f4ea; --up:#1d7a45; --dn-bg:#fbe5e7; --dn:#c0303c; --now-bg:#fff2cc; --now:#7a5600;
  --f-title:"M PLUS 1","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Orbitron","Zen Kaku Gothic New",ui-monospace,monospace;
  --ch14:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  --ch8:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;padding:28px 16px 48px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:16px;border-bottom:1px solid #c3ccd8}
header .t{display:grid;gap:6px;min-width:0}
h1{margin:0;font-family:var(--f-title);font-weight:900;font-size:clamp(22px,3.2vw,32px);letter-spacing:.03em;color:var(--title);text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
header p a{color:var(--accent-d)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar label{font-size:12px;color:var(--muted);letter-spacing:.06em}
select,button{font:inherit;color:var(--ink)}
.toolbar select,.toolbar button,.close{background:var(--card);border:1px solid var(--frame);border-radius:0;padding:8px 12px;min-height:40px;cursor:pointer}
.toolbar select:hover,.toolbar button:hover,.close:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.win{background:var(--panel);clip-path:var(--ch14);box-shadow:inset 0 0 0 1px #fff,inset 0 3px 0 var(--accent);min-width:0}
.win-h{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--head)}
.win-h::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--accent);flex:none}
.win-h h2{margin:0;font-family:var(--f-title);font-weight:800;font-size:16px;letter-spacing:.2em;color:var(--title)}
.win-h .hint{margin-left:auto;font-size:11px;color:var(--muted)}
.equip-win{flex:999 1 660px}
.side{flex:1 1 360px;display:grid;gap:20px;min-width:0}

.equip{display:grid;grid-template-columns:minmax(0,1fr) 210px minmax(0,1fr);grid-template-areas:"l c r";gap:14px;padding:16px}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.col.l{grid-area:l}.col.r{grid-area:r}.core{grid-area:c}
@media (max-width:1000px){.equip{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"l r" "c c"}}

.slot{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--frame);border-radius:0;cursor:pointer;min-width:0}
.slot:hover{border-color:var(--accent)}
.frame{flex:none;width:64px;height:64px;display:grid;place-items:center;background:var(--iconbg);border:2px solid var(--c,#c6cfda);clip-path:var(--ch8);box-shadow:inset 0 0 0 2px #fff,inset 0 0 14px var(--g,transparent);color:var(--icon-on)}
.slot.empty .frame{color:var(--icon-off)}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.sl{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.sn{font-size:14px;font-weight:700;color:var(--ink)}
.slot.empty .sn{color:var(--off);font-weight:500}
.fx{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:640px){
  .equip{gap:8px;padding:12px 10px}
  .col{gap:8px}
  .slot{padding:6px;gap:8px;align-items:center}
  .frame{width:48px;height:48px}.frame svg{width:26px;height:26px}
  .slot .fx{display:none}
  .sl{font-size:10px;letter-spacing:.02em}
  .sn{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

.chip{font-size:11px;padding:1px 6px;background:var(--chip);color:var(--ink2);white-space:normal}
.chip b{font-family:var(--f-num);font-weight:600;font-size:10.5px;margin-left:3px}
.chip .dd{margin-left:4px;font-size:9px;font-weight:700;color:var(--d)}
.chip.txt{background:transparent;border:1px dashed var(--frame);color:var(--muted)}
.empty-msg{font-size:12px;color:var(--off)}

.core{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 12px;background:#f2f5f8;border:1px solid var(--line);min-width:0}
.dial{width:170px;height:170px;border-radius:50%;border:2px solid var(--accent-d);box-shadow:inset 0 0 0 6px #f2f5f8,inset 0 0 0 7px var(--frame),0 0 24px #1a73ff22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial small{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.dial .n{font-family:var(--f-num);font-weight:700;font-size:42px;line-height:1;color:var(--title)}
.dial .n span{font-size:17px;color:var(--muted)}
.core .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.core-sets{width:100%;display:grid;gap:8px}
.cs{display:grid;gap:4px;padding:8px 10px;background:var(--card);border:1px solid var(--line)}
.cs .nm{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;min-width:0}
.gem{flex:none;width:10px;height:10px;transform:rotate(45deg);background:var(--c)}
.pips{display:flex;gap:3px;padding-left:18px}
.pips .pip{flex:0 1 18px;min-width:6px}
.pip{width:18px;height:6px;background:var(--line)}
.pip.f{background:var(--c)}
@media (max-width:1000px){.core{flex-direction:row;flex-wrap:wrap;justify-content:center}.core-sets{flex:1 1 220px;width:auto}}
@media (max-width:640px){.dial{width:120px;height:120px}.dial .n{font-size:30px}}

.sets{padding:0 16px 14px;display:grid;gap:10px}
.sets-note{margin:0;padding:10px 16px 8px;font-size:12px;color:var(--muted)}
.set{display:grid;gap:6px;padding:10px 12px;background:var(--card);border:1px solid var(--line)}
.set-h{display:flex;align-items:center;gap:8px}
.set-h strong{font-size:14px}
.set-h .cnt{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:12px;color:var(--accent-d)}
.set-h .tg{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;min-height:28px;border:1px solid var(--frame);background:var(--card);color:var(--muted);border-radius:0;cursor:pointer}
.set-h .tg.is-on{background:var(--accent);border-color:var(--accent);color:#fff}
.set-h .tg:disabled{opacity:.45;cursor:not-allowed}
.set.off{background:#f4f6f9}
.set.off strong{color:var(--muted)}
.cs.off{opacity:.5}
.tier{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:5px 8px;border:1px solid var(--line);font-size:12px}
.tier .t{font-family:var(--f-num);font-weight:600;font-size:11px;color:var(--off);padding-top:1px}
.tier .list{display:flex;flex-wrap:wrap;gap:4px}
.tier:not(.on) .chip{color:var(--off);background:#eef1f5}
.tier.on{background:var(--on-bg);border-color:var(--on-bd)}
.tier.on .t{color:var(--accent-d)}
.tot{padding:6px 18px 12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .k{font-size:13px;color:var(--ink2)}
.row .k .dd{margin-left:6px;font-size:10px;font-weight:700;color:var(--d)}
.row .v{font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--title);font-variant-numeric:tabular-nums;white-space:nowrap}

/* build switch + compare */
.seg{display:inline-flex}
.seg button{background:var(--card);border:1px solid var(--frame);border-radius:0;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:0}
.seg button.on{background:var(--title);border-color:var(--title);color:#fff}
#cmpBtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tb-sep{width:1px;height:28px;background:var(--line);margin:0 4px}
body.cmp-on .main{display:none}
body.cmp-on .seg{display:none}
.cmp{display:grid;gap:16px}
.cmp-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.cmp-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.cmp-tools button{background:var(--card);border:1px solid var(--frame);border-radius:0;padding:6px 14px;min-height:36px;cursor:pointer;font-size:13px}
.cmp-tools button:hover{border-color:var(--accent)}
.cmp-col .win-h .bl{font-family:var(--f-num);font-weight:700;font-size:13px;color:#fff;background:var(--bc);padding:1px 9px;letter-spacing:.06em}
.cmp-col[data-b="A"]{--bc:#1a73ff}
.cmp-col[data-b="B"]{--bc:#e0572a}
.cmp-col{box-shadow:inset 0 0 0 1px #fff,inset 0 3px 0 var(--bc)}
.cmp-slots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px;padding:12px 14px}
.cmp-slots .c{display:grid;gap:6px;align-content:start;min-width:0}
.cslot{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 6px;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--frame);border-radius:0;cursor:pointer;min-width:0}
.cslot:hover{border-color:var(--accent)}
.cslot .frame{width:40px;height:40px}
.cslot .frame svg{width:22px;height:22px}
.cslot.empty .frame{color:var(--icon-off)}
.cslot .info{gap:0;line-height:1.35}
.cslot .sl{font-size:10px;letter-spacing:.02em}
.cslot .sn{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cslot.empty .sn{color:var(--off);font-weight:500}
.cslot.diff{background:#fff7e0;border-color:#e6b84a;border-left-color:#c48a16}
.cslot.diff .sl::after{content:"違い";margin-left:6px;font-size:9px;font-weight:700;color:#8a5a00;background:#ffe7a8;padding:0 5px;letter-spacing:0}
.cmp-sets{display:grid;gap:6px;padding:0 14px 14px}
.cmp-sets .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em}
.cset{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--card);border:1px solid var(--line);font-size:12px;min-width:0}
.cset strong{font-size:12px;min-width:0}
.cset .tiers{display:flex;gap:4px;margin-left:auto;flex:none}
.cset .tb{font-family:var(--f-num);font-size:10px;font-weight:600;padding:1px 6px;border:1px solid var(--line);color:var(--off)}
.cset .tb.on{background:var(--on-bg);border-color:var(--on-bd);color:var(--accent-d)}
.cset .cnt{font-family:var(--f-num);font-weight:600;font-size:11px;color:var(--accent-d);flex:none}
.cset .tg{flex:none;font-size:11px;font-weight:700;padding:2px 9px;min-height:26px;border:1px solid var(--frame);background:var(--card);color:var(--muted);border-radius:0;cursor:pointer}
.cset .tg.is-on{background:var(--accent);border-color:var(--accent);color:#fff}
.cset .tg:disabled{opacity:.45;cursor:not-allowed}
.cset.off{background:#f4f6f9}.cset.off strong{color:var(--muted)}
.cmp-txt{display:flex;flex-wrap:wrap;gap:4px}
.cmp-tbl-wrap{overflow-x:auto;padding:4px 18px 12px}
.cmp-tbl{width:100%;border-collapse:collapse;font-size:13px}
.cmp-tbl th{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
.cmp-tbl th:first-child{text-align:left}
.cmp-tbl th.a{color:#1a73ff}.cmp-tbl th.b{color:#e0572a}
.cmp-tbl td{padding:7px 10px;border-bottom:1px dashed var(--line);text-align:right;font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--title)}
.cmp-tbl td:first-child{text-align:left;font-family:var(--f-body);font-weight:500;color:var(--ink2);white-space:normal}
.cmp-tbl td:first-child .dd{margin-left:6px;font-size:10px;font-weight:700;color:var(--d)}
.cmp-tbl td.z{color:var(--off);font-weight:600}
.cmp-tbl td.up{color:var(--up)}.cmp-tbl td.down{color:var(--dn)}
.cmp-tbl tr.chg td:first-child{font-weight:700}
.cmp-tbl tr.txtrow td{font-family:var(--f-body);font-weight:500;font-size:12px;text-align:left;white-space:normal;vertical-align:top;color:var(--ink2)}

/* picker */
.ov{position:fixed;inset:0;background:#0b1a2e66;display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:10}
.sheet{width:min(740px,100%);max-height:min(88vh,920px);display:flex;flex-direction:column;background:var(--panel);clip-path:var(--ch14);box-shadow:inset 0 0 0 1px #fff,inset 0 3px 0 var(--accent)}
.sheet-h{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--head)}
.sheet-h .frame{width:52px;height:52px}
.sheet-h .frame svg{width:28px;height:28px}
.sheet-h h3{margin:0;font-family:var(--f-title);font-weight:800;font-size:18px;letter-spacing:.06em;color:var(--title)}
.sheet-h p{margin:0;font-size:12px;color:var(--muted)}
.sheet-h .close{margin-left:auto;flex:none}
.sheet-b{overflow-y:auto;padding:12px 16px 16px;display:grid;gap:10px;overscroll-behavior:contain}
@media (max-width:640px){
  .ov{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:90vh;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%,0 14px)}
  .sheet-b{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .sheet-h .frame{display:none}
}
.cand{display:grid;gap:8px;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--frame);border-radius:0;cursor:pointer}
.cand:hover{border-color:var(--accent)}
.cand.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cand-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cand-h strong{font-size:15px}
.badges{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:11px;font-weight:700;padding:1px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.now{background:var(--now-bg);color:var(--now)}
.badge.fire{background:var(--on-bg);color:var(--accent-d)}
.badge.lose{background:var(--dn-bg);color:var(--dn)}
.cr{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:start}
.cr > span:first-child{font-size:11px;color:var(--muted);letter-spacing:.06em;padding-top:1px}
.cr .list{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:420px){.cr{grid-template-columns:1fr;gap:2px}}
.df{font-size:11px;padding:1px 7px}
.df b{font-family:var(--f-num);font-weight:600;font-size:10.5px;margin-left:3px}
.df.up{background:var(--up-bg)}.df.up b{color:var(--up)}
.df.down{background:var(--dn-bg)}.df.down b{color:var(--dn)}
.nochg{font-size:12px;color:var(--off)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="t">
      <h1>アクセサリー組み合わせシミュレーター</h1>
      <p>レアアバター(右)のアクセ部位ごとにセットを選ぶと、部位の能力値・発動中のセット効果・合計値を表示します。<br>数値やセット効果の情報は<a href="https://elsword-log.com/" target="_blank" rel="noopener">エルソログ</a>さんからお借りしています。</p>
    </div>
    <div class="toolbar">
      <span class="seg" role="group" aria-label="編集する構成" id="bsel">
        <button type="button" data-b="A">構成A</button><button type="button" data-b="B">構成B</button>
      </span>
      <button type="button" id="cmpBtn" aria-pressed="false">比較モード</button>
      <span class="tb-sep"></span>
      <label for="fill">全部位をまとめて</label>
      <select id="fill"></select>
      <button id="reset" type="button">すべて外す</button>
    </div>
  </header>

  <div class="main">
    <section class="win equip-win">
      <div class="win-h"><h2>装備</h2><span class="hint">部位を押すとセットを選べます</span></div>
      <div class="equip">
        <div class="col l" id="colL"></div>
        <div class="core">
          <div class="dial"><small>装備中</small><span class="n" id="eqn">0<span>/12</span></span><small>部位</small></div>
          <div class="core-sets"><span class="lbl" id="coreLbl">装備中のセット</span><div id="coreSets" style="display:grid;gap:8px"></div></div>
        </div>
        <div class="col r" id="colR"></div>
      </div>
    </section>

    <div class="side">
      <section class="win">
        <div class="win-h"><h2>セット効果</h2><span class="hint" id="actn"></span></div>
        <p class="sets-note">セット効果を有効にできるのは3セットまでです。「有効／無効」で切り替えられます。</p>
        <div class="sets" id="sets"></div>
      </section>
      <section class="win">
        <div class="win-h"><h2>合計</h2></div>
        <div class="tot" id="totals"></div>
      </section>
    </div>
  </div>

  <div class="cmp" id="cmp" hidden>
    <div class="cmp-cols">
      <section class="win cmp-col" data-b="A" id="cmpA"></section>
      <section class="win cmp-col" data-b="B" id="cmpB"></section>
    </div>
    <div class="cmp-tools">
      <button type="button" id="cpAB">構成A → 構成B にコピー</button>
      <button type="button" id="cpBA">構成B → 構成A にコピー</button>
    </div>
    <section class="win">
      <div class="win-h"><h2>合計の比較</h2><span class="hint">差は「B − A」です</span></div>
      <div class="cmp-tbl-wrap"><table class="cmp-tbl" id="cmpTbl"></table></div>
    </section>
  </div>

  <div class="ov" id="ov" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pk-title">
      <div class="sheet-h">
        <span class="frame" id="pk-frame"></span>
        <div><h3 id="pk-title"></h3><p>選んだときの合計の変化を表示しています。カードを押すと装備します。</p></div>
        <button type="button" class="close" id="pk-close">閉じる</button>
      </div>
      <div class="sheet-b" id="pk-body"></div>
    </div>
  </div>
</div>

<script>
// ---- stat definitions ----
const STATS = {
  crit:{l:"クリティカル"}, maxim:{l:"極大化"}, critdmg:{l:"クリティカルダメージ"},
  polar:{l:"両極化",d:1,cap:true}, adapt:{l:"適応力",d:1,cap:true},
  dot:{l:"持続ダメージ",d:1},
  hp100:{l:"HP100%未満の敵へのダメージ"}, hpHigh:{l:"HP50%以上の敵へのダメージ"}, hpLow:{l:"HP50%以下の敵へのダメージ"},

const KEY="elsAccSim.v3", MAX_ACTIVE=3;
let sel=null, active=null;

if(!sel||typeof sel!=="object") sel={support:"phantom",top:"phantom",avWeapon:"erebus",bottom:"aries",faceU:"aries",ring:"aries",faceL:"erebus"};
function countsOf(sl){ const c={}; for(const [k] of SLOTS){ const id=sl[k]; if(id&&byId[id]?.items[k]) c[id]=(c[id]||0)+1; } return c; }
if(!Array.isArray(active)){ const c=countsOf(sel); active=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,MAX_ACTIVE); }
// keep only equipped sets; a set that newly appears is switched on while a slot is free
function nextActive(oldSel,newSel,act){
  const oc=countsOf(oldSel), nc=countsOf(newSel);
  const a=act.filter(id=>nc[id]);
  for(const id of Object.keys(nc)) if(!oc[id] && !a.includes(id) && a.length<MAX_ACTIVE) a.push(id);
  return a;
}
active=nextActive(sel,sel,active);
// two builds (A/B); sel/active always point at the build being edited
const KEY4="elsAccSim.v4";
let builds=null, cur="A", cmpMode=false;
try{ const v=JSON.parse(localStorage.getItem(KEY4)||"null"); if(v&&v.builds&&v.builds.A&&v.builds.B){ builds=v.builds; cur=v.cur==="B"?"B":"A"; cmpMode=!!v.cmp; } }catch(_){}
if(!builds) builds={A:{sel,active},B:{sel:{...sel},active:[...active]}};
for(const b of ["A","B"]){ const x=builds[b]; if(!x.sel||typeof x.sel!=="object") x.sel={}; if(!Array.isArray(x.active)) x.active=[]; x.active=nextActive(x.sel,x.sel,x.active); }
sel=builds[cur].sel; active=builds[cur].active;
function use(b){ builds[cur].sel=sel; builds[cur].active=active; cur=b; sel=builds[b].sel; active=builds[b].active; }
const save=()=>{ builds[cur].sel=sel; builds[cur].active=active; try{ localStorage.setItem(KEY4,JSON.stringify({builds,cur,cmp:cmpMode})); }catch(_){} };
function applySel(newSel){ active=nextActive(sel,newSel,active); sel=newSel; save(); render(); }

const fmt=(k,v)=>(v>0?"+":"")+v.toLocaleString("ja-JP")+(STATS[k].u??"%");
const chip=x=>{
  if(x.k==="txt") return `<span class="chip txt">${x.n}</span>`;
  const s=STATS[x.k];
  return `<span class="chip">${s.l}<b>${fmt(x.k,x.v)}</b>${x.n?` <span style="color:var(--muted)">(${x.n})</span>`:""}${s.d?'<span class="dd">D</span>':""}</span>`;
};

function compute(sl,act){
  const tot={}, counts={}, texts=new Set(), tiers=new Set();
  const add=x=>{ if(x.k==="txt"){texts.add(x.n);return;} tot[x.k]=(tot[x.k]||0)+x.v; };
  for(const [k] of SLOTS){ const id=sl[k]; if(!id||!byId[id]?.items[k]) continue; counts[id]=(counts[id]||0)+1; byId[id].items[k].forEach(add); }
  for(const id in counts){ if(!act.includes(id)) continue; const s=byId[id];
    for(const t of Object.keys(s.bonus).map(Number)) if(counts[id]>=t){ tiers.add(id+":"+t); s.bonus[t].forEach(add); } }
  return {tot,counts,texts,tiers};
}

  sel=n; save(); render(); fill.value="";});

var render=function(){
  const R=compute(sel,active);
  let n=0;
  for(const [k] of SLOTS){
    const el=document.getElementById("s-"+k), id=sel[k], set=id&&byId[id]?.items[k]?byId[id]:null;
    const fr=el.querySelector(".frame"), sn=el.querySelector(".sn"), fx=el.querySelector(".fx");
    el.classList.toggle("empty",!set);
    if(set){ n++; const c=SETCOLOR[id]; fr.style.setProperty("--c",c); fr.style.setProperty("--g",c+"40");
      sn.textContent=set.name; fx.innerHTML=set.items[k].map(chip).join("")||'<span class="empty-msg">能力なし（セット効果のみ）</span>';
      el.setAttribute("aria-label",`${SLOTNAME[k]}：${set.name}（変更する）`);
    } else { fr.style.removeProperty("--c"); fr.style.removeProperty("--g"); sn.textContent="未装備"; fx.innerHTML="";
      el.setAttribute("aria-label",`${SLOTNAME[k]}：未装備（選ぶ）`); }
  }
  document.getElementById("eqn").innerHTML=`${n}<span>/12</span>`;
  const used=SETS.filter(s=>R.counts[s.id]).sort((a,b)=>(active.includes(b.id)-active.includes(a.id))||(R.counts[b.id]-R.counts[a.id]));
  const full=active.length>=MAX_ACTIVE;
  document.getElementById("actn").textContent=`有効 ${active.length}/${MAX_ACTIVE}`;
  document.getElementById("coreSets").innerHTML=used.length?used.map(s=>{const c=R.counts[s.id];
    return `<div class="cs${active.includes(s.id)?"":" off"}" style="--c:${SETCOLOR[s.id]}"><span class="nm"><span class="gem"></span>${s.name}</span>
      <span class="pips">${Array.from({length:Object.keys(s.items).length},(_,i)=>`<span class="pip${i<c?" f":""}"></span>`).join("")}</span></div>`;}).join(""):'<span class="empty-msg">まだ何も装備していません</span>';
  document.getElementById("sets").innerHTML=used.length?used.map(s=>{const c=R.counts[s.id], on=active.includes(s.id);
    const tg=`<button type="button" class="tg${on?" is-on":""}" data-set="${s.id}" aria-pressed="${on}" ${!on&&full?'disabled title="有効にできるのは3セットまでです"':""}>${on?"有効":"無効"}</button>`;
    const tiers=Object.keys(s.bonus).map(Number).map(t=>`<div class="tier${on&&c>=t?" on":""}"><span class="t">${t}SET</span><span class="list">${s.bonus[t].map(chip).join("")}</span></div>`).join("");
    return `<div class="set${on?"":" off"}"><div class="set-h"><span class="gem" style="--c:${SETCOLOR[s.id]}"></span><strong>${s.name}</strong><span class="cnt">${c}/${Object.keys(s.items).length}</span>${tg}</div>${tiers}</div>`;}).join(""):'<p class="empty-msg">部位を選ぶとここにセット効果が出ます。</p>';
  const rows=ORDER.filter(k=>R.tot[k]).map(k=>{const s=STATS[k];
    return `<div class="row"><span class="k">${s.l}${s.d?'<span class="dd">D</span>':""}</span><span class="v">${fmt(k,R.tot[k])}</span></div>`;});
  document.getElementById("totals").innerHTML=rows.join("")||'<p class="empty-msg">まだ何も装備していません。</p>';
}

document.getElementById("sets").addEventListener("click",ev=>{
  const b=ev.target.closest(".tg"); if(!b||b.disabled) return; const id=b.dataset.set;
  if(active.includes(id)) active=active.filter(x=>x!==id); else if(active.length<MAX_ACTIVE) active=[...active,id];
  save(); render();
  document.querySelector(`.tg[data-set="${id}"]`)?.focus();
});

// ---- picker ----
const ov=document.getElementById("ov"), pkBody=document.getElementById("pk-body");
let pkSlot=null;
function openPicker(k){
  pkSlot=k;
  document.getElementById("pk-title").textContent=(cmpMode?`構成${cur}の`:"")+SLOTNAME[k]+"を選ぶ";
  const fr=document.getElementById("pk-frame"); fr.innerHTML=svg(k,28);
  const curId=sel[k]; if(curId){fr.style.setProperty("--c",SETCOLOR[curId]);fr.style.setProperty("--g",SETCOLOR[curId]+"40");}else{fr.style.removeProperty("--c");fr.style.removeProperty("--g");}
  const base=compute(sel,active);
  const cands=[...SETS.filter(s=>s.items[k]).map(s=>s.id),""];
  cands.sort((a,b)=>(b===(curId||"__"))-(a===(curId||"__")));
  pkBody.innerHTML=cands.map(id=>card(k,id,base)).join("");
  ov.hidden=false; document.body.style.overflow="hidden";
  (pkBody.querySelector(".cand.cur")||pkBody.querySelector(".cand"))?.focus();
  pkBody.scrollTop=0;
}
function closePicker(){ ov.hidden=true; document.body.style.overflow=""; const b=document.getElementById(cmpMode?`c${cur}-${pkSlot}`:"s-"+pkSlot); pkSlot=null; b?.focus(); }
function card(k,id,base){
  const nsel={...sel}; if(id) nsel[k]=id; else delete nsel[k];
  const nact=nextActive(sel,nsel,active);
  const R=compute(nsel,nact), isCur=(sel[k]||"")===id, set=id?byId[id]:null;
  const badges=[];
  if(isCur) badges.push('<span class="badge now">装備中</span>');
  const gained=[...R.tiers].filter(x=>!base.tiers.has(x)), lost=[...base.tiers].filter(x=>!R.tiers.has(x));
  if(set && !nact.includes(id)){
    badges.push(`<span class="badge">${R.counts[id]}部位目・セット効果は無効（有効は3つまで）</span>`);
  } else if(set){
    const c=R.counts[id]||0, keys=Object.keys(set.bonus).map(Number).sort((a,b)=>a-b);
    const g=gained.filter(x=>x.startsWith(id+":")).map(x=>+x.split(":")[1]);
    if(g.length) badges.push(`<span class="badge fire">${Math.max(...g)}セット発動</span>`);
    const next=keys.find(t=>t>c);
    if(next) badges.push(`<span class="badge">${c}部位目・あと${next-c}で${next}セット</span>`);
    else if(!g.length) badges.push(`<span class="badge">${c}部位目・セット効果すべて発動中</span>`);
  }
  for(const x of lost){const [sid,t]=x.split(":"); badges.push(`<span class="badge lose">${byId[sid].name} ${t}セット解除</span>`);}
  for(const x of gained){const [sid,t]=x.split(":"); if(sid!==id) badges.push(`<span class="badge fire">${byId[sid].name} ${t}セット発動</span>`);}
  const diffs=[];
  for(const st of ORDER){ if(st==="txt") continue;
    const a=base.tot[st]||0, b=R.tot[st]||0; if(a===b) continue;
    const good=LOWER_BETTER.has(st)? b<a : b>a;
    diffs.push(`<span class="df ${good?"up":"down"}">${STATS[st].l}<b>${a?fmt(st,a):"0"}→${b?fmt(st,b):"0"}</b></span>`);
  }
  for(const n of R.texts) if(!base.texts.has(n)) diffs.push(`<span class="df up">＋${n}</span>`);
  for(const n of base.texts) if(!R.texts.has(n)) diffs.push(`<span class="df down">－${n}</span>`);
  const own=set?(set.items[k].map(chip).join("")||'<span class="nochg">能力なし（セット効果のみ）</span>'):'<span class="nochg">この部位を外します</span>';
  return `<button type="button" class="cand${isCur?" cur":""}" data-id="${id}">
    <span class="cand-h"><span class="gem" style="--c:${set?SETCOLOR[id]:"#c6cfda"}"></span><strong>${set?set.name:"外す"}</strong><span class="badges">${badges.join("")}</span></span>
    <span class="cr"><span>部位の能力</span><span class="list">${own}</span></span>
    <span class="cr"><span>合計の変化</span><span class="list">${diffs.join("")||'<span class="nochg">変化なし</span>'}</span></span>
  </button>`;
}
pkBody.addEventListener("click",ev=>{const c=ev.target.closest(".cand"); if(!c) return;
  const id=c.dataset.id, n={...sel}; if(id) n[pkSlot]=id; else delete n[pkSlot]; applySel(n); closePicker();});
document.getElementById("pk-close").addEventListener("click",closePicker);
ov.addEventListener("click",ev=>{ if(ev.target===ov) closePicker(); });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&!ov.hidden) closePicker(); });

// ---- build switch / compare mode ----
document.getElementById("bsel").addEventListener("click",ev=>{const b=ev.target.closest("button"); if(!b||b.dataset.b===cur) return; use(b.dataset.b); save(); render();});
document.getElementById("cmpBtn").addEventListener("click",()=>{cmpMode=!cmpMode; save(); render();});
function copyBuild(from,to){ use(from); const src={sel:{...sel},active:[...active]}; use(to); sel=src.sel; active=src.active; save(); render(); }
document.getElementById("cpAB").addEventListener("click",()=>copyBuild("A","B"));
document.getElementById("cpBA").addEventListener("click",()=>copyBuild("B","A"));
document.getElementById("cmp").addEventListener("click",ev=>{
  const sl=ev.target.closest(".cslot");
  if(sl){ use(sl.dataset.b); openPicker(sl.dataset.slot); return; }
  const tg=ev.target.closest(".tg");
  if(tg&&!tg.disabled){ use(tg.dataset.b); const id=tg.dataset.set;
    if(active.includes(id)) active=active.filter(x=>x!==id); else if(active.length<MAX_ACTIVE) active=[...active,id];
    save(); render(); document.querySelector(`#cmp .tg[data-b="${tg.dataset.b}"][data-set="${id}"]`)?.focus(); }
});

function renderCompare(){
  builds[cur].sel=sel; builds[cur].active=active;
  const R={A:compute(builds.A.sel,builds.A.active),B:compute(builds.B.sel,builds.B.active)};
  for(const b of ["A","B"]){
    const o=b==="A"?"B":"A", bs=builds[b].sel, os=builds[o].sel, act=builds[b].active, r=R[b];
    const slot=k=>{ const id=bs[k], set=id&&byId[id]?.items[k]?byId[id]:null, diff=(bs[k]||"")!==(os[k]||"");
      const st=set?` style="--c:${SETCOLOR[id]};--g:${SETCOLOR[id]}40"`:"";
      return `<button type="button" class="cslot${set?"":" empty"}${diff?" diff":""}" id="c${b}-${k}" data-b="${b}" data-slot="${k}" aria-label="構成${b} ${SLOTNAME[k]}：${set?set.name:"未装備"}">
        <span class="frame"${st}>${svg(k,22)}</span><span class="info"><span class="sl">${SLOTNAME[k]}</span><span class="sn">${set?set.name:"未装備"}</span></span></button>`; };
    const used=SETS.filter(s=>r.counts[s.id]).sort((x,y)=>(act.includes(y.id)-act.includes(x.id))||(r.counts[y.id]-r.counts[x.id]));
    const full=act.length>=MAX_ACTIVE;
    const sets=used.map(s=>{ const c=r.counts[s.id], on=act.includes(s.id), n=Object.keys(s.items).length;
      const tiers=Object.keys(s.bonus).map(Number).map(t=>`<span class="tb${on&&c>=t?" on":""}">${t}SET</span>`).join("");
      return `<div class="cset${on?"":" off"}"><span class="gem" style="--c:${SETCOLOR[s.id]}"></span><strong>${s.name}</strong><span class="cnt">${c}/${n}</span><span class="tiers">${tiers}</span>
        <button type="button" class="tg${on?" is-on":""}" data-b="${b}" data-set="${s.id}" aria-pressed="${on}" ${!on&&full?'disabled title="有効にできるのは3セットまでです"':""}>${on?"有効":"無効"}</button></div>`; }).join("");
    const n=SLOTS.filter(([k])=>bs[k]&&byId[bs[k]]?.items[k]).length;
    document.getElementById("cmp"+b).innerHTML=`<div class="win-h"><span class="bl">${b}</span><h2>構成${b}</h2><span class="hint">装備 ${n}/12 ・ 有効 ${act.length}/${MAX_ACTIVE}</span></div>
      <div class="cmp-slots"><div class="c">${LEFT.map(slot).join("")}</div><div class="c">${RIGHT.map(slot).join("")}</div></div>
      <div class="cmp-sets"><span class="lbl">セット（有効にできるのは3セットまで）</span>${sets||'<span class="empty-msg">まだ何も装備していません</span>'}</div>`;
  }
  // totals table
  const keys=ORDER.filter(k=>k!=="txt"&&(R.A.tot[k]||R.B.tot[k]));
  const cell=(k,v)=>v?`<td>${fmt(k,v)}</td>`:`<td class="z">0</td>`;
  const rows=keys.map(k=>{ const a=R.A.tot[k]||0, b=R.B.tot[k]||0, d=b-a, s=STATS[k];
    const good=LOWER_BETTER.has(k)? d<0 : d>0;
    const dc=d===0?`<td class="z">±0</td>`:`<td class="${good?"up":"down"}">${fmt(k,d)}</td>`;
    return `<tr class="${d?"chg":""}"><td>${s.l}${s.d?'<span class="dd">D</span>':""}</td>${cell(k,a)}${cell(k,b)}${dc}</tr>`; }).join("");
  const tA=[...R.A.texts], tB=[...R.B.texts];
  const txt=(tA.length||tB.length)?`<tr class="txtrow"><td>その他の効果</td><td><span class="cmp-txt">${tA.map(n=>`<span class="chip txt">${n}</span>`).join("")||"―"}</span></td><td><span class="cmp-txt">${tB.map(n=>`<span class="chip txt">${n}</span>`).join("")||"―"}</span></td><td></td></tr>`:"";
  document.getElementById("cmpTbl").innerHTML=`<thead><tr><th>項目</th><th class="a">構成A</th><th class="b">構成B</th><th>差（B−A）</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="z">まだ何も装備していません</td></tr>'}${txt}</tbody>`;
}
const baseRender=render;
render=function(){
  document.body.classList.toggle("cmp-on",cmpMode);
  document.getElementById("cmp").hidden=!cmpMode;
  const cb=document.getElementById("cmpBtn"); cb.setAttribute("aria-pressed",String(cmpMode)); cb.textContent=cmpMode?"比較モードを終了":"比較モード";
  for(const b of document.querySelectorAll("#bsel button")){ b.classList.toggle("on",b.dataset.b===cur); b.setAttribute("aria-pressed",String(b.dataset.b===cur)); }
  baseRender(); if(cmpMode) renderCompare();
};

render();
</script>
</body>
</html>
