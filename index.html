<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="エルソードのレアアバター(右)アクセを部位ごとに選び、部位の能力値・セット効果・合計値を確認できるシミュレーター">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>エルソード アクセ組み合わせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: equipment slots on the left, live set + totals readout on the right; stacks on phones */
:root{
  --bg:#f3f2f6; --panel:#ffffff; --ink:#1d1b26; --muted:#6b6878; --line:#dddbe5;
  --accent:#9a6a12; --accent-soft:#f6ecd8; --on:#2f7a52; --on-soft:#e2f2e9; --off:#a3a0ae;
  --chip:#efedf4; --bad:#b0413a; --bad-soft:#f7e3e1;
  --f-display:"Dela Gothic One","IBM Plex Sans JP",system-ui,sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14131a; --panel:#1d1c25; --ink:#ecebf2; --muted:#9d9aab; --line:#2f2d3a;
  --accent:#e0b04f; --accent-soft:#3a2f17; --on:#6fd29c; --on-soft:#18352a; --off:#6a6778;
  --chip:#272533; --bad:#f08a80; --bad-soft:#3d2120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131a; --panel:#1d1c25; --ink:#ecebf2; --muted:#9d9aab; --line:#2f2d3a;
  --accent:#e0b04f; --accent-soft:#3a2f17; --on:#6fd29c; --on-soft:#18352a; --off:#6a6778;
  --chip:#272533; --bad:#f08a80; --bad-soft:#3d2120; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;padding:24px 16px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.4vw,30px);margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar label{font-size:12px;color:var(--muted);letter-spacing:.04em}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 12px;font-weight:700}
.slots{display:grid;gap:0}
.slot{display:grid;grid-template-columns:132px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.slot:first-child{border-top:0}
.slot .name{font-weight:700;font-size:13px}
.slot .name small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:7px 10px}
.pick .cur{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .cur.none{color:var(--off);font-weight:400}
.pick .go{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.06em;flex:none}
/* picker sheet */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:10}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:min(86vh,900px);display:flex;flex-direction:column;box-shadow:0 18px 50px color-mix(in srgb,var(--ink) 30%,transparent)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:16px}
.sheet-h p{margin:0;font-size:12px;color:var(--muted)}
.sheet-b{overflow-y:auto;padding:12px 16px 16px;display:grid;gap:10px;overscroll-behavior:contain}
@media (max-width:640px){.ov{align-items:flex-end;padding:0}
 .sheet{border-radius:14px 14px 0 0;max-height:88vh;width:100%}
 .sheet-b{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.cand{display:grid;gap:8px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.cand:hover{border-color:var(--accent)}
.cand.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cand-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cand-h strong{font-size:15px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.now{background:var(--accent-soft);color:var(--accent)}
.badge.fire{background:var(--on-soft);color:var(--on)}
.badge.lose{background:var(--bad-soft);color:var(--bad)}
.row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start}
.row > span:first-child{font-size:11px;color:var(--muted);letter-spacing:.06em;padding-top:2px}
.row .list{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:420px){.row{grid-template-columns:1fr;gap:2px}}
.df{font-size:12px;border-radius:4px;padding:1px 7px;font-variant-numeric:tabular-nums}
.df b{font-family:var(--f-num)}
.df.up{background:var(--on-soft)}
.df.up b{color:var(--on)}
.df.down{background:var(--bad-soft)}
.df.down b{color:var(--bad)}
.nochg{font-size:12px;color:var(--off)}
.slot .fx{grid-column:2;display:flex;flex-wrap:wrap;gap:4px;min-height:0}
@media (max-width:520px){.slot{grid-template-columns:1fr}.slot .fx{grid-column:1}}
.chip{background:var(--chip);border-radius:4px;padding:1px 7px;font-size:12px}
.chip.txt{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chip b{font-family:var(--f-num);font-weight:700}
.chip.d::after{content:"D";margin-left:4px;font-size:10px;color:var(--accent);font-weight:700}
.empty{color:var(--off);font-size:12px}
.side{display:grid;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.side{position:static}}
.set{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.set + .set{margin-top:8px}
.set-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.set-head strong{font-size:14px}
.pips{display:flex;gap:3px}
.pip{width:10px;height:10px;border-radius:2px;background:var(--line)}
.pip.f{background:var(--accent)}
.tier{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:12px;padding:4px 6px;border-radius:5px;color:var(--off)}
.tier .t{font-family:var(--f-num);font-weight:700}
.tier.on{background:var(--on-soft);color:var(--ink)}
.tier.on .t{color:var(--on)}
.tier .list{display:flex;flex-wrap:wrap;gap:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.v{text-align:right;font-family:var(--f-num);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td.v .cap{display:block;font-weight:500;color:var(--muted);font-size:11px}
td.br{color:var(--muted);font-size:11px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
header p a{color:var(--accent)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>アクセサリー組み合わせシミュレーター</h1>
    <p>レアアバター(右)のアクセ部位ごとにセットを選ぶと、部位の能力値・発動中のセット効果・合計値を表示します。<br>数値やセット効果の情報は<a href="https://elsword-log.com/" target="_blank" rel="noopener">エルソログ</a>さんからお借りしています。</p>
  </header>

  <div class="toolbar">
    <label for="fill">全部位をまとめて</label>
    <select id="fill"></select>
    <button id="reset" type="button">すべて外す</button>
  </div>

  <div class="grid">
    <section class="panel">
      <h2>装備欄</h2>
      <div class="slots" id="slots"></div>
    </section>

    <div class="side">
      <section class="panel">
        <h2>セット効果</h2>
        <div id="sets"></div>
      </section>
      <section class="panel">
        <h2>合計</h2>
        <table id="totals"></table>
      </section>
    </div>
  </div>

  <div class="ov" id="ov" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pk-title">
      <div class="sheet-h"><div><h3 id="pk-title"></h3><p>各候補に「選んだときの合計の変化」が出ます。カードを押すと装備します。</p></div>
        <button type="button" id="pk-close">閉じる</button></div>
      <div class="sheet-b" id="pk-body"></div>
    </div>
  </div>

</div>

<script>
// ---- stat definitions ----
const STATS = {
  crit:{l:"クリティカル"}, maxim:{l:"極大化"}, critdmg:{l:"クリティカルダメージ"},
  polar:{l:"両極化",d:1,cap:true}, adapt:{l:"適応力",d:1,cap:true},
  dot:{l:"持続ダメージ",d:1},
  hp100:{l:"HP100%未満の敵へのダメージ"}, hpHigh:{l:"HP50%以上の敵へのダメージ"}, hpLow:{l:"HP50%以下の敵へのダメージ"},
  allskill:{l:"全スキルダメージ"}, tierskill:{l:"柔軟・強靭・強烈・超越スキルダメージ"}, strongskill:{l:"強烈・超越スキルダメージ"},
  atk:{l:"物理・魔法攻撃力"}, flatAtk:{l:"物理・魔法攻撃（固定値）",u:""}, defIgnore:{l:"物理/魔法防御無視"},
  cdr:{l:"全スキル再使用時間"}, mp:{l:"MP消費量"}, mpgain:{l:"MP獲得量"},
  aspd:{l:"動作速度"}, mspd:{l:"移動速度"}, jspd:{l:"ジャンプ速度"},
  txt:{l:"",text:true}
};
const ORDER = Object.keys(STATS);

const SLOTS = [
  ["avWeapon","アバター武器"],["acWeapon","アクセサリー武器"],["support","サポートユニット"],
  ["top","アクセサリー上衣"],["bottom","アクセサリー下衣"],
  ["faceU","アクセサリー顔上"],["faceM","アクセサリー顔中"],["faceL","アクセサリー顔下"],
  ["ear","アクセサリー耳"],["arm","アクセサリー腕"],["neck","アクセサリー首"],["ring","アクセサリー指輪"]
];

// e(stat, value, note?)
const e=(k,v,n)=>({k,v,n});
const t=(n)=>({k:"txt",v:0,n});
const SETS = [
 {id:"phantom",name:"ファントムヴェール",cap:60,items:{
   avWeapon:[e("hpHigh",5),e("hpLow",5)], support:[e("polar",2),e("adapt",2)], top:[e("adapt",2)],
   faceU:[e("dot",2)], ring:[e("hp100",3),e("tierskill",3)]},
  bonus:{2:[e("dot",10)],3:[e("hp100",10),e("cdr",-5,"縁スキル除外")]}},
 {id:"veritas",name:"ヴェリタスペルソナ",cap:55,items:{
   avWeapon:[e("hpHigh",5),e("hpLow",5)], acWeapon:[e("adapt",2),e("dot",3)],
   bottom:[e("adapt",1),e("polar",1)], ear:[e("polar",2),e("dot",1)], faceL:[e("polar",2)]},
  bonus:{2:[e("polar",3),e("dot",3)],3:[e("hpHigh",10),e("hpLow",10),e("tierskill",4)]}},
 {id:"hwarang",name:"花郎恋歌",cap:55,items:{
   avWeapon:[e("hp100",5)], top:[e("dot",2)], faceM:[e("hp100",2),e("mp",-5)],
   arm:[e("polar",1),e("cdr",-5)], neck:[e("adapt",2),e("atk",2),e("mpgain",14)]},
  bonus:{2:[e("dot",5)],3:[e("hp100",6),e("allskill",5)]}},
 {id:"aries",name:"アリエスアイトラ",cap:55,items:{
   avWeapon:[e("hp100",5)], bottom:[e("dot",1),e("polar",1)], faceU:[e("dot",1),e("allskill",1)],
   ear:[e("polar",2)], ring:[e("dot",3),e("polar",2)]},
  bonus:{2:[e("critdmg",3),e("hp100",4)],3:[e("hpHigh",6),e("hpLow",6),e("allskill",3)]}},
 {id:"grandi",name:"グランディフローラ",cap:55,items:{
   avWeapon:[e("hp100",5)], acWeapon:[e("crit",2),e("adapt",2),e("polar",2)],
   top:[e("dot",1),e("polar",1)], faceL:[e("dot",2)], support:[e("polar",2),e("cdr",-5)]},
  bonus:{2:[e("hpHigh",5),e("hpLow",5)],3:[e("dot",6),e("allskill",5)]}},
 {id:"crest",name:"クレスト・ドレイン",cap:55,items:{
   avWeapon:[e("hp100",5)], bottom:[e("dot",1),e("allskill",1)], faceM:[e("dot",2)],
   arm:[e("dot",1),e("allskill",1)], neck:[e("dot",2),e("adapt",2)]},
  bonus:{2:[e("hp100",4),e("allskill",2)],3:[e("atk",6),e("adapt",2)]}},
 {id:"tiger",name:"猛虎奇談",cap:55,items:{
   avWeapon:[e("hp100",5)], top:[e("dot",1),e("allskill",1)], faceM:[e("polar",2),e("maxim",1)],
   ear:[e("dot",1),e("allskill",1)], ring:[e("atk",3,"物理か魔法のどちらか"),e("polar",2)]},
  bonus:{2:[e("strongskill",4),e("polar",4)],3:[e("hp100",6)]}},
 {id:"erebus",name:"エレボスエレジー",cap:55,items:{
   avWeapon:[e("dot",5),e("critdmg",2)], support:[e("dot",2),e("maxim",1)],
   bottom:[e("polar",1),e("allskill",1)], faceU:[e("polar",1),e("maxim",2)], faceL:[e("polar",1),e("mp",-5)]},
  bonus:{2:[e("hp100",5)],3:[e("dot",7),e("critdmg",2)]}},
 {id:"vita",name:"ヴィータフォンターナ",cap:55,items:{
   avWeapon:[e("hp100",5)], top:[e("adapt",1),e("allskill",1)], bottom:[e("adapt",1),e("critdmg",1)],
   faceM:[e("adapt",1),e("mp",-5)], neck:[e("adapt",2),e("polar",2)]},
  bonus:{2:[e("cdr",-5),e("polar",5)],3:[e("dot",7)]}},
 {id:"abyss",name:"深淵の存在",cap:55,items:{
   avWeapon:[e("hp100",5)], arm:[e("polar",1),e("allskill",1)], faceU:[e("polar",1),e("maxim",2)],
   ear:[e("polar",1),e("critdmg",1)], ring:[e("atk",3,"物理か魔法のどちらか"),e("dot",2)]},
  bonus:{2:[e("dot",5)],3:[e("cdr",-5),e("atk",7)]}},
 {id:"empire",name:"エンパイアレイン",cap:55,items:{
   avWeapon:[e("dot",5)], top:[e("aspd",2)], bottom:[e("critdmg",2)],
   neck:[e("adapt",2),e("critdmg",2)], ear:[e("allskill",2)]},
  bonus:{2:[e("hp100",5)],3:[e("allskill",8),t("覚醒時「王国の栄光」：12秒間クリティカルダメージ+3%（CT30秒）(D)")],
   4:[t("ブレイズ発動確率+1%"),t("ピアシング発動確率+1%")]}},
 {id:"dragon",name:"飛龍乗雲",cap:55,items:{
   avWeapon:[e("hp100",5)], top:[e("crit",2),e("allskill",2)], faceU:[e("mspd",4)],
   faceM:[e("allskill",2),e("mp",-5)]},
  bonus:{2:[e("dot",3),e("cdr",-5),t("コマンド/アクティブ攻撃時5%で敵の防御-10%（5秒・CT30秒）")],3:[e("polar",7)],
   4:[t("フローズン発動確率+1%"),t("スナッチ発動確率+1%")]}},
 {id:"tourbillon",name:"トゥルービヨンアンサンブル",cap:55,items:{
   avWeapon:[e("dot",5)], top:[e("critdmg",2)], bottom:[e("crit",2),e("aspd",2)],
   ear:[e("aspd",2),e("cdr",-5)], ring:[e("atk",3,"物理か魔法のどちらか"),e("defIgnore",2,"攻撃と同じ種類")]},
  bonus:{2:[e("dot",5),t("覚醒時5秒間デバフ解除・デバフ免疫（CT30秒）")],3:[e("adapt",2),e("hp100",3)],
   4:[t("全属性抵抗+10"),e("mspd",5)]}},
 {id:"bloody",name:"ブラッディナイトメア",cap:55,items:{
   avWeapon:[e("hp100",5)], top:[e("cdr",-5),e("maxim",2)], faceM:[e("aspd",4)],
   arm:[e("allskill",2)], neck:[e("adapt",2),e("allskill",2)]},
  bonus:{2:[e("crit",2),e("polar",5)],3:[e("dot",5)],
   4:[t("覚醒時5秒間、コマンド/アクティブ打撃ダメージの10%をHP吸収（CT30秒）")]}},
 {id:"aether",name:"アイテールノビリタス",cap:55,items:{
   avWeapon:[e("dot",5)], top:[e("crit",2),e("cdr",-5)], bottom:[],
   ear:[e("mp",-5),e("maxim",2)]},
  bonus:{2:[e("adapt",5),e("maxim",5)],3:[e("dot",3),e("allskill",5)],
   4:[t("攻撃時10%で天空の落雷（硬直なし・CT3秒）")]}},
 {id:"nox",name:"ノックスウェーナートル",cap:55,items:{
   avWeapon:[e("adapt",3),e("allskill",2)], top:[e("maxim",4)], arm:[e("crit",4)], support:[e("aspd",4)]},
  bonus:{2:[e("adapt",3)],3:[e("atk",5),e("allskill",2),e("maxim",5)],
   4:[t("闇属性抵抗+50")]}},
 {id:"automata",name:"ドリーミングオートマタ",cap:55,items:{
   avWeapon:[e("polar",5)], top:[e("crit",4)], bottom:[e("maxim",4)], faceL:[e("aspd",4)],
   neck:[e("atk",1),e("cdr",-5)]},
  bonus:{2:[e("polar",3)],3:[e("crit",5),e("dot",5),e("allskill",2)],
   4:[t("打撃時5%で硬直のない打撃、5秒間被ダメージ+5%（CT20秒）")]}},
 {id:"flos",name:"フロースマジカ",cap:55,items:{
   avWeapon:[e("flatAtk",200),e("allskill",5)], top:[e("flatAtk",30),e("maxim",3),e("critdmg",1)],
   support:[e("flatAtk",20),e("aspd",4)], faceL:[e("flatAtk",30),e("crit",3),e("critdmg",1)]},
  bonus:{2:[e("atk",3),e("critdmg",2)],3:[e("polar",5),e("maxim",5)],
   4:[t("打撃時5%でバラの花びら：敵の物理/魔法防御-10%（5秒・CT30秒）(D)")]}},
 {id:"sacred",name:"セイクリッドナイト",cap:55,items:{
   avWeapon:[e("flatAtk",250),e("polar",5)], top:[e("flatAtk",50),e("cdr",-5)], bottom:[e("flatAtk",50),e("crit",4)],
   faceU:[e("flatAtk",30),e("aspd",4)], faceM:[e("flatAtk",30),e("maxim",4)]},
  bonus:{2:[t("覚醒時10秒間 超越ダメージ+3%（CT60秒）(D)"),e("allskill",3)],3:[e("polar",5),e("allskill",2)],
   4:[e("mspd",5),e("jspd",5),t("光属性抵抗+20")]}},
 {id:"sea",name:"滄海遺珠",cap:55,items:{
   avWeapon:[e("flatAtk",200),e("crit",3),e("polar",3)], support:[e("flatAtk",40),e("crit",2),e("maxim",3)],
   top:[e("flatAtk",40),e("crit",4)],
   bottom:[e("flatAtk",40),e("maxim",4)]},
  bonus:{2:[e("adapt",3)],3:[e("allskill",8),e("cdr",-3)],
   4:[t("覚醒時、周囲のPTメンバーのデバフ解除・HP/MP15%回復（CT30秒）(D)")]}}
];
const byId = Object.fromEntries(SETS.map(s=>[s.id,s]));

// ---- state ----
const KEY="elsAccSim.v2";
let sel={};
try{ sel = JSON.parse(localStorage.getItem(KEY)||"null") || null; }catch(_){ sel=null; }
if(!sel){ // example loadout
  sel={support:"phantom",top:"phantom",avWeapon:"erebus",bottom:"aries",faceU:"aries",ring:"aries",faceL:"erebus"};
}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(sel)); }catch(_){} };

const fmt=(k,v)=>(v>0?"+":"")+v.toLocaleString("ja-JP")+(STATS[k].u??"%");
const chip=x=>{if(x.k==="txt")return `<span class="chip txt">${x.n}</span>`;const s=STATS[x.k];return `<span class="chip${s.d?" d":""}">${s.l} <b>${fmt(x.k,x.v)}</b>${x.n?` <span style="color:var(--muted)">(${x.n})</span>`:""}</span>`;};

// ---- build slot rows ----
const slotsEl=document.getElementById("slots");
const SLOTNAME=Object.fromEntries(SLOTS);
slotsEl.innerHTML = SLOTS.map(([k,l])=>{
  const n = SETS.filter(s=>s.items[k]).length;
  return `<div class="slot"><span class="name">${l}<small>${n}セットに存在</small></span>
    <button type="button" class="pick" id="s-${k}" data-slot="${k}" aria-haspopup="dialog"><span class="cur"></span><span class="go">選ぶ</span></button>
    <div class="fx" id="fx-${k}"></div></div>`;
}).join("");
slotsEl.addEventListener("click",ev=>{const b=ev.target.closest(".pick");if(b) openPicker(b.dataset.slot);});

const fill=document.getElementById("fill");
fill.innerHTML=`<option value="">セットを選択…</option>`+SETS.map(s=>`<option value="${s.id}">${s.name}（${Object.keys(s.items).length}部位）</option>`).join("");
fill.addEventListener("change",()=>{const id=fill.value;if(!id)return;
  for(const k of Object.keys(byId[id].items)) sel[k]=id; save(); render(); fill.value="";});
document.getElementById("reset").addEventListener("click",()=>{sel={};save();render();});

// ---- render ----
// totals for any loadout
function compute(sl){
  const tot={}, breakdown={}, counts={}, texts=new Set(), tiers=new Set();
  const add=(x,src)=>{if(x.k==="txt"){texts.add(x.n);return;}tot[x.k]=(tot[x.k]||0)+x.v;(breakdown[x.k]=breakdown[x.k]||[]).push(src);};
  for(const [k] of SLOTS){const id=sl[k]; if(!id||!byId[id]?.items[k]) continue;
    counts[id]=(counts[id]||0)+1; byId[id].items[k].forEach(x=>add(x,"部位"));}
  for(const id in counts){const s=byId[id];
    for(const t of Object.keys(s.bonus).map(Number)) if(counts[id]>=t){tiers.add(id+":"+t); s.bonus[t].forEach(x=>add(x,"セット"));}}
  return {tot,breakdown,counts,texts,tiers};
}
const LOWER_BETTER=new Set(["cdr","mp"]);

function render(){
  const R=compute(sel), tot=R.tot, breakdown=R.breakdown, counts=R.counts;
  for(const [k] of SLOTS){
    const id=sel[k], box=document.getElementById("fx-"+k), cur=document.querySelector("#s-"+k+" .cur");
    if(!id||!byId[id]?.items[k]){ box.innerHTML='<span class="empty">未装備</span>'; cur.textContent="未装備"; cur.className="cur none"; continue; }
    box.innerHTML=byId[id].items[k].map(chip).join("")||'<span class="empty">能力なし（セット効果のみ）</span>'; cur.textContent=byId[id].name; cur.className="cur";
  }
  // sets
  const used=SETS.filter(s=>counts[s.id]);
  document.getElementById("sets").innerHTML = used.length? used.map(s=>{
    const c=counts[s.id];
    const tiers=Object.keys(s.bonus).map(Number).map(t=>{
      const on=c>=t;
      return `<div class="tier${on?" on":""}"><span class="t">${t}set</span><span class="list">${s.bonus[t].map(chip).join("")}</span></div>`;
    }).join("");
    return `<div class="set"><div class="set-head"><strong>${s.name}</strong>
      <span class="pips" aria-label="${c}/5部位">${[1,2,3,4,5].map(i=>`<span class="pip${i<=c?" f":""}"></span>`).join("")}</span></div>${tiers}</div>`;
  }).join("") : '<p class="empty">部位を選ぶとここにセット効果が出ます。</p>';
  // totals
  const rows=ORDER.filter(k=>tot[k]).map(k=>{
    const s=STATS[k];
    return `<tr><td>${s.l}${s.d?' <span class="chip d" style="padding:0 4px"></span>':""}</td><td class="v">${fmt(k,tot[k])}</td></tr>`;
  });
  document.getElementById("totals").innerHTML = rows.join("") || '<tr><td class="empty">まだ何も装備していません。</td></tr>';
}
// ---- picker ----
const ov=document.getElementById("ov"), pkBody=document.getElementById("pk-body");
let pkSlot=null;
function openPicker(k){
  pkSlot=k;
  document.getElementById("pk-title").textContent=SLOTNAME[k]+"を選ぶ";
  const base=compute(sel);
  const cands=[...SETS.filter(s=>s.items[k]).map(s=>s.id), ""];
  cands.sort((a,b)=>(b===(sel[k]||"__"))-(a===(sel[k]||"__")));
  pkBody.innerHTML=cands.map(id=>card(k,id,base)).join("");
  ov.hidden=false; document.body.style.overflow="hidden";
  (pkBody.querySelector(".cand.cur")||pkBody.querySelector(".cand"))?.focus();
  pkBody.scrollTop=0;
}
function closePicker(){ov.hidden=true;document.body.style.overflow="";const b=document.getElementById("s-"+pkSlot);pkSlot=null;b?.focus();}

function card(k,id,base){
  const nsel={...sel}; if(id) nsel[k]=id; else delete nsel[k];
  const R=compute(nsel), isCur=(sel[k]||"")===id, set=id?byId[id]:null;
  // badges
  const badges=[];
  if(isCur) badges.push('<span class="badge now">装備中</span>');
  const gained=[...R.tiers].filter(x=>!base.tiers.has(x)), lost=[...base.tiers].filter(x=>!R.tiers.has(x));
  if(set){
    const c=R.counts[id]||0, keys=Object.keys(set.bonus).map(Number).sort((a,b)=>a-b);
    const g=gained.filter(x=>x.startsWith(id+":")).map(x=>+x.split(":")[1]);
    if(g.length) badges.push(`<span class="badge fire">${Math.max(...g)}セット発動</span>`);
    const next=keys.find(t=>t>c);
    if(next) badges.push(`<span class="badge">${c}部位目・あと${next-c}で${next}セット</span>`);
    else if(!g.length) badges.push(`<span class="badge">${c}部位目・セット効果すべて発動中</span>`);
  }
  for(const x of lost){const [sid,t]=x.split(":"); badges.push(`<span class="badge lose">${byId[sid].name} ${t}セット解除</span>`);}
  for(const x of gained){const [sid,t]=x.split(":"); if(sid!==id) badges.push(`<span class="badge fire">${byId[sid].name} ${t}セット発動</span>`);}
  // diff
  const diffs=[];
  for(const st of ORDER){ if(st==="txt") continue;
    const a=base.tot[st]||0, b=R.tot[st]||0; if(a===b) continue;
    const good=LOWER_BETTER.has(st)? b<a : b>a;
    diffs.push(`<span class="df ${good?"up":"down"}">${STATS[st].l} <b>${a?fmt(st,a):"0"}→${b?fmt(st,b):"0"}</b></span>`);
  }
  for(const n of R.texts) if(!base.texts.has(n)) diffs.push(`<span class="df up">＋${n}</span>`);
  for(const n of base.texts) if(!R.texts.has(n)) diffs.push(`<span class="df down">－${n}</span>`);
  const own = set? (set.items[k].map(chip).join("")||'<span class="nochg">能力なし（セット効果のみ）</span>') : '<span class="nochg">この部位を外します</span>';
  return `<button type="button" class="cand${isCur?" cur":""}" data-id="${id}">
    <span class="cand-h"><strong>${set?set.name:"外す"}</strong><span class="badges">${badges.join("")}</span></span>
    <span class="row"><span>部位の能力</span><span class="list">${own}</span></span>
    <span class="row"><span>合計の変化</span><span class="list">${diffs.join("")||'<span class="nochg">変化なし</span>'}</span></span>
  </button>`;
}
pkBody.addEventListener("click",ev=>{const c=ev.target.closest(".cand"); if(!c) return;
  const id=c.dataset.id; if(id) sel[pkSlot]=id; else delete sel[pkSlot]; save(); render(); closePicker();});
document.getElementById("pk-close").addEventListener("click",closePicker);
ov.addEventListener("click",ev=>{if(ev.target===ov) closePicker();});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!ov.hidden) closePicker();});

render();
</script>
</body>
</html>
